version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: elearning_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: elearning_db
    volumes:
      - mongo_data:/data/db
    networks:
      - elearning_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: elearning_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/elearning_db
    depends_on:
      - mongodb
    networks:
      - elearning_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: elearning_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - elearning_network

volumes:
  mongo_data:

networks:
  elearning_network:
    driver: bridge
